default_parameters: &default
  is_default: yes
  parameter_metadata:
    $combination_kwd: "It specifies how to group the science spectra taken in stare and 
                       polarimetry mode for processing. It has no effects on nodding data: exposures
                       within the same OB are processed and combined together.
                       Valid entries are: 
                       'tpl.start': it processes together the spectra taken within the same OB (default).
                       'arcfile': it processes files independently. This option is useful to process time-series data."
  recipe_parameters: &default_rp
    science_nodding:
      cr2res.cr2res_obs_nodding.create_idp: "TRUE"
    science_polarimetry:
      cr2res.cr2res_obs_nodding.create_idp: "FALSE"
    science_staring:
      cr2res.cr2res_obs_staring.create_idp: "TRUE"
    standard_star:
      cr2res.cr2res_obs_nodding.create_idp: "FALSE"
  workflow_parameters:
    $combination_kwd: 'tpl.start'

qc0_parameters:
  <<: *default
  is_default: no

science_parameters:
  <<: *default
  is_default: no
  recipe_parameters:
    <<: *default_rp
    standard_star:
      cr2res.cr2res_obs_nodding.create_idp: "TRUE"
  packaging_config: &default_pkg
    science_nodding:
      - $DATASET/$TIMESTAMP/SPECTRUM_COMBINED_$obs.targ.name$.$EXT: [ ^OBS_NODDING_EXTRACTC_IDP$ ]
      - $DATASET/$TIMESTAMP/SPECTRUM_A_$obs.targ.name$.$EXT: [ ^OBS_NODDING_EXTRACTA_IDP$ ]
      - $DATASET/$TIMESTAMP/SPECTRUM_B_$obs.targ.name$.$EXT: [ ^OBS_NODDING_EXTRACTB_IDP$ ]
    science_2d:
      - $DATASET/$TIMESTAMP/SPECTRA_$obs.targ.name$.$EXT: [ ^OBS_2D_EXTRACT$ ]
    science_polarimetry:
      - $DATASET/$TIMESTAMP/SPECTRA_POL_A_$obs.targ.name$.$EXT: [ ^OBS_POL_SPECA$ ]
      - $DATASET/$TIMESTAMP/SPECTRA_POL_B_$obs.targ.name$.$EXT: [ ^OBS_POL_SPECB$ ]
    science_staring:
      - $DATASET/$TIMESTAMP/SPECTRA_$obs.targ.name$.$EXT: [ ^OBS_STARING_EXTRACT$ ]

idp_parameters:
  <<: *default
  is_default: no
  recipe_parameters:
    <<: *default_rp
    standard_star:
      cr2res.cr2res_obs_nodding.create_idp: "TRUE"
  packaging_config:
    <<: *default_pkg
